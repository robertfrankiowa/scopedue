<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reminder · ScopeDue</title>
<link rel="icon" type="image/png" href="icons/icon-32.png">
<script src="boot.js"></script>
<script src="i18n.js"></script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="reminder.css">
</head>
<body>
<main class="rw" role="alertdialog" aria-labelledby="rw-h" aria-describedby="rw-list">
  <header class="rw-hd">
    <span class="rw-ic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
    <div><h1 id="rw-h">Reminder</h1><p class="rw-sub">ScopeDue</p></div>
  </header>
  <ul id="rw-list" class="rw-list"></ul>
  <p id="rw-empty" class="rw-empty" hidden>Nothing to remind you of any more.</p>
</main>
<template id="rw-item">
  <li>
    <p class="rw-t"></p>
    <div class="rw-m"><b class="rw-p"></b><span class="rw-w"></span></div>
    <div class="rw-a">
      <button type="button" class="rw-done">Done</button>
      <select class="rw-snz" aria-label="Remind me again">
        <option value="">Remind me again…</option>
        <option value="10">In 10 minutes</option>
        <option value="60">In 1 hour</option>
        <option value="tom">Tomorrow 9:00</option>
      </select>
      <button type="button" class="rw-open">Open the note</button>
    </div>
  </li>
</template>
<script src="reminder.js"></script>
</body>
</html>
