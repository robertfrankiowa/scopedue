<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<!-- @csp -->
<title>Client portal · ScopeDue</title>
<!-- @head -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Newsreader:opsz,wght@6..72,400..500&display=swap" rel="stylesheet">
<!-- @css -->
</head>
<body>
<div class="page">
  <header class="top">
    <button type="button" class="brand" data-a="landing" aria-label="Back to the start"><span class="logo" id="logo"></span><span class="brand-txt"><b id="brandB"></b><small id="brandS"></small></span></button>
    <div class="top-r">
      <button type="button" class="about lang-b" id="langBtn" data-a="lang" translate="no"></button>
      <button type="button" class="thm-b" id="thmBtn" data-a="menu-theme" aria-haspopup="dialog" aria-expanded="false" aria-controls="tmenu" aria-label="Appearance" title="Appearance"><span class="thm-dot" id="thmDot" aria-hidden="true"></span></button>
      <button type="button" class="about" id="helpBtn" data-a="help"><span>Need help?</span></button>
      <button type="button" class="bell" id="bellBtn" data-a="menu-bell" aria-haspopup="dialog" aria-expanded="false" aria-controls="notif">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.2 16.5V11a5.8 5.8 0 0 1 11.6 0v5.5l1.4 1.7H4.8z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
        <span class="bdg" id="bdg" data-n="0" aria-hidden="true">0</span>
      </button>
      <button type="button" class="who" id="whoBtn" data-a="menu-acct" aria-haspopup="true" aria-expanded="false" aria-controls="acctMenu">
        <span class="av" id="whoAv"></span><span class="who-t"><b id="whoName"></b><small id="whoBiz"></small></span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>
      </button>
    </div>
    <div class="amenu" id="acctMenu" hidden></div>
    <div class="tmenu" id="tmenu" role="dialog" aria-label="Appearance" hidden></div>
    <div class="notif" id="notif" role="dialog" aria-label="Notifications">
      <div class="n-h"><h3>Notifications</h3><button type="button" class="n-mark" id="nMark" data-a="markall">Mark all read</button></div>
      <ul class="n-list" id="nList" role="list"></ul>
      <div class="n-f" id="nHist"><button type="button" data-a="hist"><span>View project history</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
    </div>
  </header>
  <p class="demo-ro-bar" id="demoRo" role="note" hidden><b>Sample</b><span>You can look around: opening, reading and downloading work. Approving, replying and the rest are off.</span></p>
  <div id="view"></div>
</div>

<dialog class="drawer" id="dScope" aria-label="Scope"></dialog>
<dialog class="drawer" id="dReq" aria-label="Changes"></dialog>
<dialog class="drawer" id="dCopies" aria-label="Shared copies"></dialog>
<dialog class="drawer" id="dHist" aria-label="History"></dialog>
<dialog class="drawer" id="dAbout" aria-label="About the studio"></dialog>
<dialog class="dlg" id="dDlg"></dialog>

<div class="mail" id="mail" role="status" aria-live="polite">
  <div class="mail-h"><span class="mk2"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><b>ScopeDue</b><span class="when">now</span><button type="button" class="mail-x" data-a="mailx" aria-label="Close the email"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <p class="mail-s">Your approval code</p>
  <p class="mail-c" id="mailCode">000 000</p>
  <p class="mail-n" id="mailFor"></p>
  <div class="mail-f"><span id="mailTo"></span><button type="button" data-a="mailfill">Fill it in</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="tk"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span id="toastTxt"></span></div>
<div id="receipt" aria-hidden="true"></div>
<div class="dock" id="dock"><div class="dock-p" id="dockP"></div><button type="button" class="dock-b" id="dockB" data-a="dock" aria-expanded="false" aria-controls="dockP"><i></i><span>Prototype</span></button></div>

<!-- @js -->
</body>
</html>
