<div class="app" id="app" data-v="dashboard">
  <!-- Sidebar: kept as-is -->
  <!-- @include sidebar.html -->

  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="side"><svg class="i"><use href="#i-menu"/></svg></button>
      <div class="brand-m"><img class="brand-mk" src="<!-- @brand-mark -->" alt="" width="147" height="216"><span translate="no">ScopeDue</span></div>
      <div class="search-w">
        <label class="search" for="q">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="qf" aria-autocomplete="list" aria-haspopup="listbox" aria-label="Search or jump to" placeholder="Search projects, clients, work…" autocomplete="off" spellcheck="false" enterkeyhint="go"><kbd class="k"><span class="k-cmd" id="k-cmd">⌘ K</span><span class="k-esc">Esc</span></kbd>
        </label>
        <div class="qf" id="qf" role="listbox" aria-label="Quick find results"></div>
        <div class="sr-only" id="qf-live" role="status" aria-live="polite"></div>
      </div>
      <button type="button" class="qs-x" id="qs-x">Cancel</button>
      <div class="top-actions">
        <button type="button" class="icon-btn qs-btn" id="qs-btn" aria-label="Search" aria-expanded="false"><svg class="i" aria-hidden="true"><use href="#i-search"/></svg></button>
        <button type="button" class="icon-btn" id="xs-mail" aria-label="Messages from ScopeDue support" title="Messages" aria-haspopup="dialog" aria-expanded="false" aria-controls="xs-pop"><svg class="i" aria-hidden="true"><use href="#i-mail"/></svg><span class="nbadge" id="xs-badge" aria-hidden="true" hidden>0</span></button>
        <button type="button" class="icon-btn" id="bell" aria-label="Notifications, 4 unread" aria-haspopup="dialog" aria-expanded="false" aria-controls="notif"><svg class="i"><use href="#i-bell"/></svg><span class="nbadge" id="nbadge" aria-hidden="true">4</span></button>
        <button type="button" class="btn-primary" id="npj-btn" data-open-drawer="npj" data-focus="#npj-n"><svg class="i"><use href="#i-plus"/></svg><span>New project</span></button>
      </div>
    </header>

          <nav class="sf-nav" aria-label="Footer">
            <a href="#" data-ft="updates">What’s new</a>
            <a href="#" data-ft="support">Help</a>
          </nav>
          <div class="theme-sw" id="theme-sw" role="group" aria-label="Theme" data-t="system">
            <span class="ts-thumb" aria-hidden="true"></span>
            <!-- @themes:footer -->
          </div>
        </div>
      </div>
    </footer>

<div class="notif" id="notif" role="dialog" aria-label="Notifications" tabindex="-1">
  <div class="n-h">
    <h2>Notifications</h2>
    <div class="n-acts"><button type="button" class="link" id="n-readall">Mark all as read</button><button type="button" class="link" id="n-clear">Clear all</button></div>
  </div>
  <div class="n-tools">
    <div class="seg" role="group" aria-label="Filter notifications" id="notif-seg">
      <button type="button" data-f="all" aria-pressed="true">All <span class="n" id="n-all">0</span></button>
      <button type="button" data-f="unread" aria-pressed="false">Unread <span class="n" id="n-unread">0</span></button>
    </div>
  </div>
  <div class="n-body" id="n-body"></div>
</div>

<!-- v71: the envelope's popup, like the bell's: the latest conversations with the ScopeDue team, read with fetch (49-support.js) -->
<div class="notif xs-pop" id="xs-pop" role="dialog" aria-label="Messages" tabindex="-1">
  <div class="n-h">
    <h2>Messages</h2>
    <div class="n-acts"><button type="button" class="link" id="xs-pop-new">New message</button><button type="button" class="link" id="xs-pop-clear">Clear</button></div>
  </div>
  <div class="n-body" id="xs-pop-body"></div>
  <div class="xs-pop-f"><button type="button" class="link" id="xs-pop-all">See all messages</button></div>
</div>

<div class="tip" id="tip" aria-hidden="true"></div>
<div class="ldb-bar" id="ldb-bar" role="status" hidden><span id="ldb-msg"></span><button type="button" id="ldb-act"></button></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-undo">Undo</button></div>

<div class="rq-view" id="rq-view" role="dialog" aria-modal="true" aria-label="Project record" hidden><div class="rq-bar"><b>Project record</b><button type="button" class="btn-primary btn-sm" id="rq-print">Print or save as PDF</button><button type="button" class="btn-ghost btn-sm rq-x" id="rq-x">Close</button></div><div class="rq-body"></div></div>
