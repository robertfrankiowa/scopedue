<aside class="drawer" id="drawer-grab" role="dialog" aria-modal="true" aria-labelledby="cx-title" tabindex="-1">
  <header class="dr-h">
    <div>
      <h2 id="cx-title">Capture</h2>
      <p>Write it down now, decide about it later.</p>
    </div>
    <div class="dr-close"><kbd>Esc</kbd><button type="button" class="dr-x" data-close aria-label="Close capture"><svg class="i"><use href="#i-x"/></svg></button></div>
  </header>
  <div class="dr-body">
    <form class="cf" id="cx-f" novalidate autocomplete="off">
      <div class="fld st"><label for="cx-t">What is it?</label><textarea id="cx-t" rows="3" maxlength="2000" placeholder="An idea, something the client asked for, a link worth keeping"></textarea></div>
      <div class="fld st"><label for="cx-u">Link <span class="opt">Optional</span></label><input id="cx-u" inputmode="url" maxlength="300" placeholder="https://…"></div>
      <div class="fld st"><label for="cx-p">Project</label><span class="pd-sel"><select id="cx-p"></select><svg class="i" aria-hidden="true"><use href="#i-chev"/></svg></span></div>
      <fieldset class="fld st x6-kinds" id="cx-k"><legend>Save it as</legend>
        <label><input type="radio" name="cx-k" value="note"><span>Note</span></label><label><input type="radio" name="cx-k" value="link"><span>Link</span></label><label><input type="radio" name="cx-k" value="later"><span>Later</span></label><label><input type="radio" name="cx-k" value="next"><span>Next step</span></label>
      </fieldset>
      <p class="hint st" id="cx-h"></p>
      <p class="err" id="cx-e" role="alert"></p>
    </form>
  </div>
  <footer class="dr-foot"><span class="c-hint"><kbd>⌘</kbd> <kbd>↵</kbd> to save</span><div class="f-acts"><button type="button" class="btn-ghost btn-sm" data-close>Cancel</button><button type="submit" form="cx-f" class="btn-primary btn-sm">Save</button></div></footer>
</aside>
