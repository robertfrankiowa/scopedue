<aside class="drawer" id="drawer-gate" role="dialog" aria-modal="true" aria-labelledby="gate-title" tabindex="-1">
  <header class="dr-h">
    <div>
      <h2 id="gate-title">Scope Gate</h2>
      <p id="gate-sub">Four questions decide whether this goes to Now, Next or Never.</p>
    </div>
    <div class="dr-close"><kbd>Esc</kbd><button type="button" class="dr-x" data-close aria-label="Close the Scope Gate"><svg class="i"><use href="#i-x"/></svg></button></div>
  </header>
  <div class="dr-body">
    <form class="cf" id="gate" novalidate autocomplete="off"><div id="gate-body"></div></form>
  </div>
  <footer class="dr-foot"><span class="c-hint" id="gate-hint"><kbd>⌘</kbd> <kbd>↵</kbd> to confirm</span><div class="f-acts"><button type="button" class="btn-ghost btn-sm" data-close>Cancel</button><button type="submit" form="gate" class="btn-primary btn-sm" id="gate-go" disabled>Add to Now</button></div></footer>
</aside>
