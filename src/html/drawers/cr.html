<aside class="drawer" id="drawer-cr" role="dialog" aria-modal="true" aria-labelledby="dcr-title" tabindex="-1">
  <header class="dr-h">
    <div>
      <h2 id="dcr-title">New request</h2>
      <p id="dcr-sub">Log something the client asked for outside the agreed Scope.</p>
    </div>
    <div class="dr-close"><kbd>Esc</kbd><button type="button" class="dr-x" data-close aria-label="Close new request"><svg class="i"><use href="#i-x"/></svg></button></div>
  </header>
  <div class="dr-body">
    <form class="cf" id="ncr" novalidate autocomplete="off">
      <div class="fld st" id="f-ncr-t"><label for="ncr-t">Title <span class="opt">Required</span></label><input id="ncr-t" type="text" placeholder="For example, Add a wishlist" maxlength="70" aria-describedby="e-ncr-t"><span class="err" id="e-ncr-t"></span></div>
      <div class="fld st" id="f-ncr-d"><label for="ncr-d">What was asked <span class="opt">Required</span></label><textarea id="ncr-d" rows="5" placeholder="Paste or summarize the request in the client's words." maxlength="500" aria-describedby="e-ncr-d"></textarea><span class="err" id="e-ncr-d"></span></div>
      <div class="fld st"><label id="ncr-src-l">Where it came from</label>
        <div class="seg" id="ncr-src" role="group" aria-labelledby="ncr-src-l"><button type="button" data-f="email" aria-pressed="true">Email</button><button type="button" data-f="chat" aria-pressed="false">Chat</button><button type="button" data-f="call" aria-pressed="false">Call</button><button type="button" data-f="meeting" aria-pressed="false">Meeting</button></div></div>
      <div class="fld st"><label id="ncr-kind-l">Effect on Scope</label>
        <div class="seg" id="ncr-kind" role="group" aria-labelledby="ncr-kind-l"><button type="button" data-f="adds" aria-pressed="true">Adds or changes work</button><button type="button" data-f="ask" aria-pressed="false">Question only</button></div>
        <span class="hint" id="ncr-kind-d">It sits outside the trusted baseline until it is agreed and added to Scope.</span></div>
    </form>
  </div>
  <footer class="dr-foot"><span class="c-hint"><kbd>⌘</kbd> <kbd>↵</kbd> to log</span><div class="f-acts"><button type="button" class="btn-ghost btn-sm" data-close>Cancel</button><button type="submit" form="ncr" class="btn-primary btn-sm" id="ncr-go">Log request</button></div></footer>
</aside>
