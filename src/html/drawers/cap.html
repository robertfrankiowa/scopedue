<aside class="drawer" id="drawer-cap" role="dialog" aria-modal="true" aria-labelledby="cap-title" tabindex="-1">
  <header class="dr-h">
    <div>
      <h2 id="cap-title">Capture evidence</h2>
      <p id="cap-sub">ScopeDue keeps the fingerprint and the details. The original stays with you.</p>
    </div>
    <div class="dr-close"><kbd>Esc</kbd><button type="button" class="dr-x" data-close aria-label="Close capture"><svg class="i"><use href="#i-x"/></svg></button></div>
  </header>
  <div class="dr-body">
    <form class="cf" id="cap" novalidate autocomplete="off">
      <div class="fld st"><label id="cap-mode-l">Source</label>
        <div class="seg" id="cap-mode" role="group" aria-labelledby="cap-mode-l"><button type="button" data-f="file" aria-pressed="true">File</button><button type="button" data-f="text" aria-pressed="false">Pasted text</button></div></div>
      <div class="fld st" id="f-cap-file"><label for="cap-file">File <span class="opt">Up to 100 MB</span></label>
        <div class="pde-drop" id="cap-drop"><span class="pde-ic" aria-hidden="true"><svg class="i"><use href="#i-doc"/></svg></span><div class="pde-drop-b"><b id="cap-fn">Choose a file</b><small id="cap-fs">Or drop it here. It is read in this browser and never uploaded.</small></div><input class="pde-file" type="file" id="cap-file" aria-describedby="cap-fs e-cap-file"></div>
        <span class="err" id="e-cap-file" role="alert"></span></div>
      <div class="fld st" id="f-cap-txt" hidden><label for="cap-txt">Text <span class="opt cnt" id="cap-cnt">0 / 20000</span></label>
        <textarea id="cap-txt" rows="7" maxlength="20000" placeholder="Paste an email, a chat or a note exactly as it was written."></textarea>
        <span class="hint">The fingerprint covers every character, including spaces and line breaks. The text stays on this device.</span></div>
      <div class="fld st" id="f-cap-t"><label for="cap-t">Title <span class="opt">Required</span></label><input id="cap-t" type="text" maxlength="80" placeholder="For example, Email · Hà approves checkout" aria-describedby="e-cap-t"><span class="err" id="e-cap-t"></span></div>
      <div class="fld-row st">
        <div class="fld"><label for="cap-kind">Kind</label><select id="cap-kind"><option value="email">Email</option><option value="shot">Screenshot</option><option value="chat">Chat</option><option value="doc" selected>Document</option><option value="build">Build</option><option value="text">Note</option></select></div>
        <div class="fld"><label for="cap-link">Linked to</label><select id="cap-link"></select></div>
      </div>
      <div class="pde-fpv st" id="cap-fpv" aria-live="polite"></div>
    </form>
  </div>
  <footer class="dr-foot"><span class="c-hint"><kbd>⌘</kbd> <kbd>↵</kbd> to capture</span><div class="f-acts"><button type="button" class="btn-ghost btn-sm" data-close>Cancel</button><button type="submit" form="cap" class="btn-primary btn-sm" id="cap-go" disabled>Capture</button></div></footer>
</aside>
