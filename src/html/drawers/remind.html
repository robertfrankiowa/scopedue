<aside class="drawer" id="drawer-remind" role="dialog" aria-modal="true" aria-labelledby="rm-title" tabindex="-1">
  <header class="dr-h">
    <div>
      <h2 id="rm-title">Remind</h2>
      <p id="rm-sub">One message covers everything they owe you. Edit it, then copy it or open it in your email.</p>
    </div>
    <div class="dr-close"><kbd>Esc</kbd><button type="button" class="dr-x" data-close aria-label="Close reminder"><svg class="i"><use href="#i-x"/></svg></button></div>
  </header>
  <div class="dr-body">
    <div class="cf">
      <div class="cf-prev st"><span class="pj-av" id="rm-av" aria-hidden="true">?</span><div><b id="rm-pn">Client</b><small id="rm-ps"></small></div></div>
      <div class="st"><h3 class="sec" id="rm-ch" style="margin:0 0 10px">What it covers</h3><ul class="ca-cov" id="rm-cov" aria-labelledby="rm-ch"></ul></div>
      <div class="fld st"><label for="rm-t">Message</label><textarea id="rm-t" rows="12" maxlength="1500" spellcheck="true"></textarea><span class="hint" id="rm-hint">Sending it is up to you. Copying adds a line to each project’s History and restarts the chase clock.</span></div>
    </div>
  </div>
  <footer class="dr-foot"><span class="c-hint"><kbd>⌘</kbd> <kbd>↵</kbd> to copy</span><div class="f-acts"><a class="btn-ghost btn-sm" id="rm-mail" href="#" hidden>Open in email</a><button type="button" class="btn-primary btn-sm" id="rm-go">Copy and log</button></div></footer>
</aside>
